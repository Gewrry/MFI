        <!-- External Pneumatic Air Dashpot Cylinder -->
        <rect x="310" y="60" width="55" height="120" rx="6" fill="url(#steelGrad)" stroke="#475569" stroke-width="3"/>
        <line x1="337" y1="180" x2="337" y2="240" stroke="#D97706" stroke-width="8"/>
    
    </g>
    <text x="250" y="465" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13" letter-spacing="1">SWING CHECK VALVE W/ AIR CUSHION</text>
