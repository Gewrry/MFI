        <rect x="140" y="400" width="220" height="40" rx="8" fill="url(#blueGrad)"/>
    
    </g>
    <text x="250" y="465" text-anchor="middle" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13" letter-spacing="1">FIRE HYDRANT (3-WAY W/ PUMPER NOZZLE)</text>
