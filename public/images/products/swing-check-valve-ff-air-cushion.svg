        <rect x="80" y="220" width="340" height="190" rx="16" fill="url(#blueGrad)" stroke="#1E3A8A" stroke-width="4"/>
        <rect x="60" y="200" width="30" height="230" rx="6" fill="url(#blueGrad)"/>
